name: Build Native Apps (Windows / Linux / Android)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  desktop-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux WebKitGTK dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri bundle
        working-directory: platforms/tauri
        run: cargo tauri build ${{ matrix.args }}

      - name: Upload Desktop Bundles
        uses: actions/upload-artifact@v4
        with:
          name: clouddrop-${{ matrix.platform }}
          path: |
            platforms/tauri/target/release/bundle/**/*.exe
            platforms/tauri/target/release/bundle/**/*.msi
            platforms/tauri/target/release/bundle/**/*.AppImage
            platforms/tauri/target/release/bundle/**/*.deb

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 SDK & Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Clean stale Android assets before Gradle sync
        run: rm -rf platforms/android/app/src/main/assets

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Android Debug APK
        working-directory: platforms/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: clouddrop-android-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
