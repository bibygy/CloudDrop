<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4d6bfe" />
  <meta name="description" content="CloudDrop — 跨平台清爽云端投递箱，支持 Windows / Android / Linux 三端互通与 Google Drive / OneDrive 云盘直连" />
  <title>CloudDrop</title>
  <link rel="icon" type="image/png" href="./assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />

  <!-- Zero-FOUC synchronous theme & typography bootstrap (DeepSeek HARNESS pattern) -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('clouddrop_settings_v1');
        var cfg = raw ? JSON.parse(raw) : {};
        var pref = cfg.theme || 'system';
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (cfg.uiFontSize) document.documentElement.style.setProperty('--dsw-font-size-ui', cfg.uiFontSize + 'px');
        if (cfg.codeFontSize) document.documentElement.style.setProperty('--dsw-font-size-code', cfg.codeFontSize + 'px');
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/app.css" />
</head>
<body>
  <div class="app-shell" id="app-shell">
    <!-- Mobile / Compact Drawer Scrim -->
    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <!-- Left Sidebar Rail -->
    <aside class="sidebar" aria-label="导航与云盘状态">
      <div class="sidebar-brand">
        <div class="brand-mark">
          <img src="./assets/icon.svg" alt="CloudDrop" />
          <span>CloudDrop</span>
        </div>
        <span class="brand-pill">DROP</span>
      </div>

      <div class="sidebar-scroll">
        <!-- Cloud Storage Status Card -->
        <div class="cloud-card" id="cloud-status-card" role="button" tabindex="0" title="点击配置 Google Drive / OneDrive"></div>

        <!-- Category Filters -->
        <div>
          <div class="nav-section-title"><span>投递分类</span></div>
          <nav class="nav-list" id="filter-nav"></nav>
        </div>

        <!-- Connected Devices -->
        <div>
          <div class="nav-section-title"><span>我的设备</span></div>
          <div class="device-tag-list" id="device-nav"></div>
        </div>
      </div>

      <div class="sidebar-footer">
        <button class="icon-btn" id="btn-theme" type="button" title="切换主题"></button>
        <button class="icon-btn" id="btn-settings-side" type="button" title="外观与设置"></button>
      </div>
    </aside>

    <!-- Main Stage -->
    <main class="main-stage">
      <!-- Top Glass Header -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn" id="btn-toggle-sidebar" type="button" title="展开/收起侧边栏 (Ctrl+B)"></button>
          <span class="view-title" id="view-title">全部投递</span>
          <span class="view-subtitle" id="view-subtitle">0 条</span>
        </div>

        <div class="search-box" id="search-box">
          <span id="search-icon-slot" style="display:flex;align-items:center;"></span>
          <input class="search-input" id="search-input" type="search" placeholder="搜索笔记、文件名或 #标签..." autocomplete="off" />
          <span class="search-kbd">Ctrl K</span>
          <button class="search-clear" id="search-clear" type="button" aria-label="清空搜索"></button>
        </div>

        <div class="topbar-right">
          <button class="pill-badge e2ee" id="e2ee-badge" type="button" style="display:none" title="端到端加密设置"></button>
          <button class="icon-btn" id="btn-sync" type="button" title="立即同步云盘"></button>
          <button class="icon-btn" id="btn-compact" type="button" title="切换 Edge Drop 窄侧栏模式"></button>
          <button class="icon-btn" id="btn-settings-top" type="button" title="云盘与系统设置"></button>
        </div>
      </header>

      <!-- Compact / Mobile Pill Filter Bar -->
      <div class="compact-tabs" id="compact-tabs"></div>

      <!-- Chronological Drop Feed -->
      <section class="stream-viewport" id="stream-viewport" aria-label="投递流">
        <div class="stream-container" id="stream-container"></div>
      </section>

      <!-- Floating Bottom Composer Dock -->
      <footer class="composer-dock">
        <div class="composer-card">
          <div class="staged-files" id="staged-files"></div>
          <textarea
            class="composer-input"
            id="composer-input"
            rows="1"
            placeholder="输入笔记、代码，或 Ctrl+V 粘贴截图 / 拖放文件..."
          ></textarea>
          <div class="composer-toolbar">
            <div class="composer-tools-left">
              <input type="file" id="file-picker" multiple style="display:none" />
              <button class="icon-btn" id="btn-attach" type="button" title="添加文件或图片"></button>
              <button class="icon-btn" id="btn-paste" type="button" title="从剪贴板粘贴截图或文本"></button>
              <button class="icon-btn" id="btn-code-snip" type="button" title="插入代码块"></button>
              <button class="icon-btn" id="btn-add-tag" type="button" title="插入 #标签"></button>
            </div>
            <div class="composer-tools-right">
              <span class="composer-hint" id="composer-hint">Enter 发送 · Shift+Enter 换行</span>
              <button class="send-btn" id="btn-send" type="button" disabled>
                <span id="btn-send-icon" style="display:flex;align-items:center;"></span>
                <span>发送</span>
              </button>
            </div>
          </div>
        </div>
      </footer>
    </main>
  </div>

  <!-- Full-Window Drag & Drop Overlay -->
  <div class="drop-overlay" id="drop-overlay">
    <div class="drop-overlay-box">
      <div id="drop-overlay-icon" style="width:36px;height:36px;"></div>
      <strong>松开鼠标，立即投递到 CloudDrop</strong>
      <span>支持多文件、截图、压缩包、文档，将自动同步到你的云盘</span>
    </div>
  </div>

  <!-- Image Lightbox Modal -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览">
    <div class="lightbox-bar">
      <span class="lightbox-title" id="lightbox-title">图片预览</span>
      <div class="lightbox-actions">
        <button class="lightbox-btn" id="lightbox-download" type="button">下载原图</button>
        <button class="lightbox-btn" id="lightbox-close" type="button">关闭 (Esc)</button>
      </div>
    </div>
    <div class="lightbox-canvas" id="lightbox-canvas">
      <img id="lightbox-img" src="" alt="" />
    </div>
  </div>

  <!-- Settings & Cloud Setup Modal -->
  <div class="modal-backdrop" id="settings-modal" role="dialog" aria-modal="true" aria-label="设置">
    <div class="modal-panel">
      <div class="modal-header">
        <h2 class="modal-title">CloudDrop 设置</h2>
        <button class="icon-btn" id="settings-close" type="button" aria-label="关闭"></button>
      </div>
      <div class="modal-tabs" id="settings-tabs"></div>
      <div class="modal-body" id="settings-body"></div>
    </div>
  </div>

  <!-- Toast Stack -->
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
