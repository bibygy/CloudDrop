name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - "platforms/android/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 SDK & Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Clean stale Android assets before Gradle sync
        run: rm -rf platforms/android/app/src/main/assets

      - name: Decode persistent signing keystore (if configured in Secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > platforms/android/app/clouddrop-signing.jks
            echo "Persistent signing keystore enabled (supports direct in-place APK upgrades)."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret configured; falling back to ephemeral debug keystore."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build CloudDrop Android APK
        working-directory: platforms/android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload CloudDrop APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudDrop-Android-APK
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
