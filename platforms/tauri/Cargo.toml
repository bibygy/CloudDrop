[package]
name = "clouddrop"
version = "0.1.0"
description = "CloudDrop — 跨平台清爽云端投递箱 (Windows / Android / Linux)"
authors = ["CloudDrop"]
edition = "2021"

[lib]
name = "clouddrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
